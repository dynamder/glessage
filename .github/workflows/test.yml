name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          # 'latest' bypasses setup-beam's loose range matching, which fails
          # for exact 3-part Gleam versions like "1.18.1" (and would need
          # version-type: strict, which then breaks loose OTP matching)
          gleam-version: latest
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
