name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-beam installs Erlang/OTP and rebar3 from builds.hex.pm.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          rebar3-version: "3"
      # setup-beam resolves Gleam versions via the GitHub releases *list* API
      # (api.github.com/repos/gleam-lang/gleam/releases), which returns an
      # empty list from runners (rate-limited), so "1.18.1"/"latest" both fail
      # with "version not found in version list". Download the release binary
      # directly from github.com instead — release assets are served by the
      # CDN and are not subject to the API rate limit.
      - name: Install Gleam
        run: |
          curl -fsSL -o /tmp/gleam.tar.gz \
            https://github.com/gleam-lang/gleam/releases/download/v1.18.1/gleam-v1.18.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/gleam.tar.gz -C /usr/local/bin gleam
          gleam --version
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
